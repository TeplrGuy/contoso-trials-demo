[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contoso-trials-demo"
version = "0.1.0"
description = "Contoso Trials Azure Functions demo"
requires-python = ">=3.13"
dependencies = [
  "azurefunctions-agents-runtime[monitor]>=0.1.0b16",
  "azure-identity>=1.25.1,<2",
  "azure-search-documents>=11.6.0,<12",
  "azure-storage-blob>=12.26.0,<13",
  "jmespath>=1.0.1,<2",
]
