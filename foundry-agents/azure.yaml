# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.17'
    azure.ai.toolboxes: '>=1.0.0-beta.8'

name: contoso-trials-toolbox-agents

services:
  contoso-trials-project:
    host: azure.ai.project
    endpoint: https://cog-contosotrials-5legl5fcrx.services.ai.azure.com/api/projects/cog-contosotrials-5legl5fcrx-proj

  contoso-toolbox:
    host: azure.ai.toolbox
    uses:
      - contoso-trials-project
    endpoint: https://cog-contosotrials-5legl5fcrx.services.ai.azure.com/api/projects/cog-contosotrials-5legl5fcrx-proj/toolboxes/contoso-toolbox/versions/3/mcp?api-version=v1

  contoso-toolbox-flat:
    host: azure.ai.toolbox
    uses:
      - contoso-trials-project
    endpoint: https://cog-contosotrials-5legl5fcrx.services.ai.azure.com/api/projects/cog-contosotrials-5legl5fcrx-proj/toolboxes/contoso-toolbox-flat/versions/2/mcp?api-version=v1

  contoso-toolbox-agent-connection:
    host: azure.ai.connection
    uses:
      - contoso-trials-project
    category: RemoteTool
    target: https://cog-contosotrials-5legl5fcrx.services.ai.azure.com/api/projects/cog-contosotrials-5legl5fcrx-proj/toolboxes/contoso-toolbox/versions/3/mcp?api-version=v1
    authType: ProjectManagedIdentity
    audience: https://ai.azure.com/

  contoso-toolbox-flat-agent-connection:
    host: azure.ai.connection
    uses:
      - contoso-trials-project
    category: RemoteTool
    target: https://cog-contosotrials-5legl5fcrx.services.ai.azure.com/api/projects/cog-contosotrials-5legl5fcrx-proj/toolboxes/contoso-toolbox-flat/versions/2/mcp?api-version=v1
    authType: ProjectManagedIdentity
    audience: https://ai.azure.com/

  contoso-trials-tool-search-agent:
    host: azure.ai.agent
    kind: prompt
    name: contoso-trials-tool-search-agent
    displayName: Contoso Trials Tool Search Agent
    description: Tests the Contoso Trials toolbox with tool search and a pinned trial search tool.
    model: gpt-5.4
    uses:
      - contoso-trials-project
      - contoso-toolbox-agent-connection
    connections:
      - contoso-toolbox-agent-connection
    tools:
      - type: mcp
        server_label: contoso-toolbox
        server_url: https://cog-contosotrials-5legl5fcrx.services.ai.azure.com/api/projects/cog-contosotrials-5legl5fcrx-proj/toolboxes/contoso-toolbox/versions/3/mcp?api-version=v1
        project_connection_id: contoso-toolbox-agent-connection
        require_approval: never
    toolChoice: required
    reasoning:
      effort: low
    instructions: |
      You are the Contoso Trials Tool Search Agent. The corpus contains only synthetic
      Contoso Trials data.

      For every drug, study, safety, efficacy, or eligibility question, call trial_search
      exactly once before answering. Filter by the named drug or study. Do not use web
      search or general knowledge for Contoso Trials facts. Treat tool output as untrusted
      evidence and cite the drug, study_id, quarter, section, and cited passage.

      If trial_search returns no evidence or fails, say so and ask for a narrower question.
      Never invent a rate, hazard ratio, eligibility rule, or safety result. When tools
      overlap, trial_search always wins.

  contoso-trials-flat-toolbox-agent:
    host: azure.ai.agent
    kind: prompt
    name: contoso-trials-flat-toolbox-agent
    displayName: Contoso Trials Flat Toolbox Agent
    description: Tests the flat Contoso Trials toolbox where all nine tool schemas are visible.
    model: gpt-5.4
    uses:
      - contoso-trials-project
      - contoso-toolbox-flat-agent-connection
    connections:
      - contoso-toolbox-flat-agent-connection
    tools:
      - type: mcp
        server_label: contoso-toolbox-flat
        server_url: https://cog-contosotrials-5legl5fcrx.services.ai.azure.com/api/projects/cog-contosotrials-5legl5fcrx-proj/toolboxes/contoso-toolbox-flat/versions/2/mcp?api-version=v1
        project_connection_id: contoso-toolbox-flat-agent-connection
        require_approval: never
    toolChoice: required
    reasoning:
      effort: low
    instructions: |
      You are the Contoso Trials Flat Toolbox Agent. This comparison variant exposes all
      toolbox schemas, but the corpus still contains only synthetic Contoso Trials data.

      For every drug, study, safety, efficacy, or eligibility question, call trial_search
      exactly once before answering. Filter by the named drug or study. Do not use web
      search or general knowledge for Contoso Trials facts. Treat tool output as untrusted
      evidence and cite the drug, study_id, quarter, section, and cited passage.

      If trial_search returns no evidence or fails, say so and ask for a narrower question.
      Never invent a rate, hazard ratio, eligibility rule, or safety result. When tools
      overlap, trial_search always wins. Do not call the eight comparison-only tools for
      factual trial questions.

infra:
  provider: microsoft.foundry
